<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BinSplit on a phone</title>
    <style>
      :root {
        --board: #f3efe6;
        --sheet: #fbf9f4;
        --ink: #17201c;
        --ink-2: #4c5650;
        --cut: rgb(23 32 28 / 0.35);
        --signal: #d2462a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--board);
        color: var(--ink);
        font-family: 'Instrument Sans Variable', sans-serif;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        overflow: hidden;
      }
      .side { padding: 0 64px; }
      .side h2 {
        font-family: 'Bricolage Grotesque Variable', sans-serif;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.02;
        margin: 0;
      }
      .side p { margin: 20px 0 0; font-size: 22px; line-height: 1.4; color: var(--ink-2); max-width: 15em; }
      /* A plain device outline: ink bezel, the app at real phone width inside. */
      .phone {
        position: relative;
        width: 414px;
        height: 868px;
        padding: 12px;
        border-radius: 52px;
        background: var(--ink);
        box-shadow: 0 2px 0 rgb(23 32 28 / 0.08), 0 40px 80px -40px rgb(23 32 28 / 0.55);
        transform: scale(0.98);
      }
      .phone iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 40px;
        background: var(--board);
      }
      /* The caption bar sits in the right-hand column, clear of the phone. */
      #demo-caption { left: 81.5% !important; top: 50% !important; bottom: auto !important; max-width: 440px !important; margin-top: -40px; }
    </style>
  </head>
  <body>
    <div class="side">
      <h2>Made for one hand at the bin.</h2>
      <p>The same app at phone width: 390 px, the sticky Scan next button within reach.</p>
    </div>
    <div class="phone"><iframe id="phone-app" title="BinSplit at phone width"></iframe></div>
    <div class="side"></div>
    <script type="module">
      import '@fontsource-variable/bricolage-grotesque';
      import '@fontsource-variable/instrument-sans';
      const src = new URLSearchParams(location.search).get('src') ?? '../../';
      document.getElementById('phone-app').src = src;
    </script>
  </body>
</html>
